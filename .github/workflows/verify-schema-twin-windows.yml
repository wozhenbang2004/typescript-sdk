name: Schema twin Windows verification

on:
  push:
    branches: [verify-schema-twin-windows-3120]

permissions:
  contents: read

env:
  SOURCE_SHA: 0e2bb6d60a0da7089e2deb34d4d022588a0b3926
  EXPECTED_TEST_SHA256: 6d11516b9c104bd4dc447176c5cbc9f919fc60bb4537afdc2cf8ca18b63ea5cc

jobs:
  verify:
    if: github.repository == 'wozhenbang2004/typescript-sdk'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Read exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wozhenbang2004/typescript-sdk
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
          clean: false
          fetch-depth: 1
      - name: Record native Windows environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'schema-twin-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $details = @(
            "UTC=$([DateTime]::UtcNow.ToString('o'))"
            "OS=$([Environment]::OSVersion.VersionString)"
            "PowerShell=$($PSVersionTable.PSVersion)"
            "GitExecutable=$((Get-Command git -ErrorAction Stop).Source)"
            "GitVersion=$(git --version)"
            "PythonExecutable=$((Get-Command python -ErrorAction Stop).Source)"
            "PythonVersion=$(python --version)"
            "WorkflowCommit=$env:GITHUB_SHA"
            "RunnerImage=$env:ImageOS $env:ImageVersion"
          )
          $details | Tee-Object -FilePath (Join-Path $evidence 'environment.log')
          if (-not $IsWindows) { throw 'Native Windows is required' }
      - name: Verify stable-stat old and fresh Windows checkouts
        shell: python
        run: |
          import contextlib
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys
          import tempfile
          import traceback
          
          SOURCE_SHA = os.environ['SOURCE_SHA']
          TWINS = 'packages/core-internal/test/corpus/schema-twins'
          REVISIONS = ('2025-11-25', '2026-07-28')
          SCHEMAS = [f'{TWINS}/{revision}.schema.json' for revision in REVISIONS]
          MANIFEST = f'{TWINS}/manifest.json'
          
          
          def verify():
              assert os.name == 'nt' and platform.system() == 'Windows', 'Native Windows is required'
              source = Path(os.environ['GITHUB_WORKSPACE']) / 'source'
              scratch = Path(tempfile.mkdtemp(prefix='schema twin windows ', dir=os.environ['RUNNER_TEMP']))
              empty = scratch / 'empty'
              empty.mkdir()
              config = scratch / 'empty.gitconfig'
              config.write_bytes(b'')
              env = dict(os.environ, GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL=str(config), GIT_TERMINAL_PROMPT='0')
              git_exe = shutil.which('git')
              pwsh_exe = shutil.which('pwsh')
              assert git_exe and pwsh_exe
          
              def git(cwd, *args, raw=False):
                  cmd = [git_exe, '-c', f'core.hooksPath={empty}', '-c', f'core.attributesFile={config}', *args]
                  print(f'git cwd={cwd} args={json.dumps(args)}')
                  result = subprocess.run(cmd, cwd=cwd, env=env, capture_output=True, timeout=60)
                  if result.stderr:
                      print(result.stderr.decode('utf-8', errors='replace').strip())
                  if not raw and result.stdout:
                      print(result.stdout.decode('utf-8', errors='replace').strip())
                  result.check_returncode()
                  return result.stdout if raw else result.stdout.decode('utf-8').strip()
          
              version = git(source, '--version')
              assert '.windows.' in version, f'Expected Git for Windows, got {version}'
              assert git(source, 'rev-parse', 'HEAD') == SOURCE_SHA
              print(f'PLATFORM={platform.platform()} GIT={git_exe} PWSH={pwsh_exe}')
              print(f'SOURCE=https://github.com/wozhenbang2004/typescript-sdk/tree/{SOURCE_SHA}')
              blobs = {path: git(source, 'show', f'{SOURCE_SHA}:{path}', raw=True) for path in [*SCHEMAS, MANIFEST, '.gitattributes']}
              assert blobs['.gitattributes'] == (b'# Preserve the upstream bytes pinned by the schema-twin provenance manifest.\n'
                                              b'packages/core-internal/test/corpus/schema-twins/*.schema.json -text\n')
              manifest = json.loads(blobs[MANIFEST])
              assert set(manifest['files']) == set(REVISIONS)
          
              def check(directory, label, crlf):
                  result = {}
                  for revision, path in zip(REVISIONS, SCHEMAS):
                      data = (directory / path).read_bytes()
                      entry = manifest['files'][revision]
                      digest = hashlib.sha256(data).hexdigest()
                      matches = len(data) == entry['bytes'] and digest == entry['sha256']
                      assert data == (blobs[path].replace(b'\n', b'\r\n') if crlf else blobs[path])
                      assert matches is (not crlf)
                      result[revision] = {'bytes': len(data), 'sha256': digest, 'matches_manifest': matches}
                  print(label + ': ' + json.dumps(result, sort_keys=True))
                  return result
          
              origin, existing, fresh = (scratch / name for name in ('origin', 'existing clone', 'fresh clone'))
              origin.mkdir()
              for path in [*SCHEMAS, MANIFEST]:
                  target = origin / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(blobs[path])
              ordinary = b'unrelated\ntext\n'
              (origin / 'ordinary.txt').write_bytes(ordinary)
              source_result = check(origin, 'Exact source bytes', False)
              git(origin, 'init', '-b', 'main', f'--template={empty}')
              git(origin, 'config', 'user.name', 'Schema twin verification')
              git(origin, 'config', 'user.email', 'verification@example.invalid')
              git(origin, '-c', 'core.autocrlf=false', 'add', '.')
              git(origin, 'commit', '-m', 'Local fixture before attribute')
              baseline = git(origin, 'rev-parse', 'HEAD')
              git(scratch, 'clone', '--local', '--no-hardlinks', '-c', 'core.autocrlf=true', str(origin), str(existing))
              assert git(existing, 'config', '--get', 'core.autocrlf') == 'true'
              before = check(existing, 'Existing clone before attribute', True)
              unchanged = {path: (existing / path).read_bytes() for path in [MANIFEST, 'ordinary.txt']}
              assert unchanged[MANIFEST] == blobs[MANIFEST].replace(b'\n', b'\r\n')
              assert unchanged['ordinary.txt'] == ordinary.replace(b'\n', b'\r\n')
              assert git(existing, 'status', '--porcelain') == ''
          
              # Model a long-lived, non-racy checkout deterministically, without a sleep.
              for path in SCHEMAS:
                  os.utime(existing / path, (946684800, 946684800))
              git(existing, 'update-index', '--refresh', '--', *SCHEMAS)
              assert git(existing, 'status', '--porcelain') == ''
              (origin / '.gitattributes').write_bytes(blobs['.gitattributes'])
              git(origin, '-c', 'core.autocrlf=false', 'add', '.gitattributes')
              git(origin, 'commit', '-m', 'Local fixture with exact PR attribute')
              assert git(origin, 'diff', '--name-only', baseline, 'HEAD') == '.gitattributes'
              git(existing, 'pull', '--ff-only')
              after_pull = check(existing, 'After attribute-only pull', True)
              assert before == after_pull
              index_before = git(existing, 'ls-files', '--stage', raw=True)
              tree_before = git(existing, 'write-tree')
          
              git(existing, 'ls-files', '--debug', '--', *SCHEMAS)
              print('STAT_BEFORE: ' + json.dumps({path: {'size': (existing / path).stat().st_size,
                    'mtime_ns': (existing / path).stat().st_mtime_ns} for path in SCHEMAS}))
              print('INDEX_MTIME_NS=' + str((existing / '.git/index').stat().st_mtime_ns))
              # RED: --force does not bypass a matching index stat cache.
          
              recovery = '& git checkout-index --force --index -- ' + ' '.join('"' + path + '"' for path in SCHEMAS)
              recovery += '; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
              print('POWERSHELL RECOVERY: ' + recovery)
              result = subprocess.run([pwsh_exe, '-NoLogo', '-NoProfile', '-NonInteractive', '-Command', recovery],
                                      cwd=existing, env=env, capture_output=True, text=True, timeout=60)
              print(f'PowerShell recovery exit={result.returncode}\n{result.stdout}{result.stderr}')
              result.check_returncode()
              legacy = check(existing, 'After old force command: unchanged CRLF bytes', True)
              assert legacy == after_pull
              assert git(existing, 'ls-files', '--stage', raw=True) == index_before
              assert git(existing, 'write-tree') == tree_before
              git(existing, 'ls-files', '--debug', '--', *SCHEMAS)
              print('STAT_AFTER_OLD: ' + json.dumps({path: {'size': (existing / path).stat().st_size,
                    'mtime_ns': (existing / path).stat().st_mtime_ns} for path in SCHEMAS}))
              print('RED reproduced: old command exits zero but leaves both CRLF files unchanged')
          
              # GREEN: move only the targets out of the worktree, retaining their exact bytes.
              backup = scratch / 'schema backups'
              backup.mkdir()
              backed_up = {path: (existing / path).read_bytes() for path in SCHEMAS}
              for path in SCHEMAS:
                  destination = backup / Path(path).name
                  assert not destination.exists()
                  shutil.move(str(existing / path), str(destination))
                  assert not (existing / path).exists()
              recovery = recovery.replace('--force ', '')
              print('POWERSHELL RECOVERY AFTER BACKUP: ' + recovery)
              result = subprocess.run([pwsh_exe, '-NoLogo', '-NoProfile', '-NonInteractive', '-Command', recovery],
                                      cwd=existing, env=env, capture_output=True, text=True, timeout=60)
              print(f'PowerShell recovery exit={result.returncode}\n{result.stdout}{result.stderr}')
              result.check_returncode()
              recovered = check(existing, 'After move-to-backup and checkout-index --index', False)
              for path, data in backed_up.items():
                  assert (backup / Path(path).name).read_bytes() == data
              assert git(existing, 'ls-files', '--stage', raw=True) == index_before
              assert git(existing, 'write-tree') == tree_before
              assert git(existing, 'status', '--porcelain') == ''
              git(existing, 'diff', '--cached', '--check')
              for path, data in unchanged.items():
                  assert (existing / path).read_bytes() == data
              attrs = git(existing, 'check-attr', 'text', '--', *SCHEMAS, MANIFEST)
              for path in SCHEMAS:
                  assert f'{path}: text: unset' in attrs
              assert f'{MANIFEST}: text: unspecified' in attrs
              print('PASS: index content unchanged; worktree clean; manifest and unrelated text unchanged and CRLF')
          
              git(scratch, 'clone', '--local', '--no-hardlinks', '-c', 'core.autocrlf=true', str(origin), str(fresh))
              fresh_result = check(fresh, 'Fresh clone with attribute', False)
              assert git(fresh, 'status', '--porcelain') == ''
              for path, data in unchanged.items():
                  assert (fresh / path).read_bytes() == data
              # Separate safety case: recreate INDEX content, retaining intentional unstaged edits in backups.
              staged = b'{"preserve":"staged target"}\n'
              unstaged = b'{"preserve":"unstaged target"}\n'
              (existing / SCHEMAS[0]).write_bytes(staged)
              git(existing, 'add', '--', SCHEMAS[0])
              (existing / SCHEMAS[0]).write_bytes(unstaged)
              (existing / 'ordinary.txt').write_bytes(b'keep staged unrelated\r\n')
              git(existing, 'add', '--', 'ordinary.txt')
              (existing / 'ordinary.txt').write_bytes(b'keep unstaged unrelated\r\n')
              staged_index = git(existing, 'ls-files', '--stage', raw=True)
              staged_tree = git(existing, 'write-tree')
              other_paths = [MANIFEST, 'ordinary.txt', '.gitattributes']
              others_before = {path: (existing / path).read_bytes() for path in other_paths}
              staged_backups = {path: (existing / path).read_bytes() for path in SCHEMAS}
              backup2 = scratch / 'intentional edit backups'
              backup2.mkdir()
              for path in SCHEMAS:
                  destination = backup2 / Path(path).name
                  assert not destination.exists()
                  shutil.move(str(existing / path), str(destination))
                  assert not (existing / path).exists()
              result = subprocess.run([pwsh_exe, '-NoLogo', '-NoProfile', '-NonInteractive', '-Command', recovery],
                                      cwd=existing, env=env, capture_output=True, text=True, timeout=60)
              result.check_returncode()
              assert (existing / SCHEMAS[0]).read_bytes() == staged
              assert (existing / SCHEMAS[1]).read_bytes() == blobs[SCHEMAS[1]]
              assert git(existing, 'ls-files', '--stage', raw=True) == staged_index
              assert git(existing, 'write-tree') == staged_tree
              for path, data in staged_backups.items():
                  assert (backup2 / Path(path).name).read_bytes() == data
              for path, data in others_before.items():
                  assert (existing / path).read_bytes() == data
              print('PASS safety case: staged target restored from INDEX; unstaged target preserved in backup; unrelated staged/unstaged data unchanged')
              return {'result': 'PASS', 'native_windows': True, 'platform': platform.platform(), 'git_version': version,
                      'source_commit': SOURCE_SHA, 'source_bytes': source_result, 'existing_before': before,
                      'after_attribute_only_pull': after_pull, 'after_old_force_command': legacy, 'after_recovery': recovered, 'fresh_clone': fresh_result,
                      'index_content_unchanged': True, 'normal_recovery_worktree_clean': True, 'other_text_preserved': True,
                      'original_crlf_backups_preserved': True,
                      'intentional_edits_case': {'index_content_unchanged': True, 'staged_target_restored': True,
                                                 'unstaged_target_backed_up': True, 'unrelated_staged_and_unstaged_preserved': True},
                      'scope': 'Focused Git checkout and byte/SHA checks only; complete-file Vitest results are reported separately.'}
          
          
          class Tee:
              def __init__(self, output, logfile):
                  self.output, self.logfile = output, logfile
          
              def write(self, text):
                  self.output.write(text)
                  self.logfile.write(text)
                  self.flush()
          
              def flush(self):
                  self.output.flush()
                  self.logfile.flush()
          
          
          if __name__ == '__main__':
              evidence = Path(os.environ['RUNNER_TEMP']) / 'schema-twin-evidence'
              evidence.mkdir(exist_ok=True)
              summary = {'result': 'FAIL', 'native_windows': os.name == 'nt', 'source_commit': SOURCE_SHA}
              with (evidence / 'verification.log').open('w', encoding='utf-8', newline='\n') as logfile:
                  with contextlib.redirect_stdout(Tee(sys.stdout, logfile)), contextlib.redirect_stderr(Tee(sys.stderr, logfile)):
                      try:
                          summary = verify()
                          print('PASS: native Windows schema-twin checkout verification')
                      except Exception:
                          traceback.print_exc()
              (evidence / 'result.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write(f"## Schema-twin Windows verification: {summary['result']}\n\nSource: `{SOURCE_SHA}`\n\n")
                  output.write('See the uploaded verification log and result.json. This is a focused checkout test, not the full SDK test suite.\n')
              sys.exit(0 if summary['result'] == 'PASS' else 1)
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Set up source-pinned pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.26.1
          run_install: false
      - name: Materialize unchanged complete test and corpus
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          
          TEST = 'packages/core-internal/test/wire/schemaTwinConformance.test.ts'
          CORPUS = 'packages/core-internal/test/corpus'
          VERSIONS = {'vitest': '4.1.2', 'ajv': '8.18.0', 'ajv-formats': '3.0.1'}
          
          
          def isolated_lock(lock):
              importer = lock.split('\n  packages/core-internal:\n', 1)[1].split('\n  packages/', 1)[0]
              root = '\nimporters:\n\n  .:\n    devDependencies:\n'
              for name, version in VERSIONS.items():
                  match = re.search(rf'^      {re.escape(name)}:\n        specifier: [^\n]+\n        version: ([^\n]+)$', importer, re.M)
                  assert match and match[1].split('(')[0] == version, (name, match)
                  root += f'      {name}:\n        specifier: {version}\n        version: {match[1]}\n'
              # Preserve the source lock's package integrity hashes and peer-resolved snapshots.
              return lock.split('\ncatalogs:', 1)[0] + root + '\npackages:' + lock.split('\npackages:', 1)[1]
          
          
          def main():
              assert os.name == 'nt', 'Native Windows is required'
              source = Path(os.environ['GITHUB_WORKSPACE']) / 'source'
              sha = os.environ['SOURCE_SHA']
              harness = Path(os.environ['RUNNER_TEMP']) / 'schema-twin-full-test'
              evidence = Path(os.environ['RUNNER_TEMP']) / 'schema-twin-evidence'
              harness.mkdir()
              def git(*args):
                  return subprocess.check_output(['git', *args], cwd=source, timeout=60)
              assert git('rev-parse', 'HEAD').decode().strip() == sha
              paths = [TEST, f'{CORPUS}/fixtures', f'{CORPUS}/schema-twins']
              entries = git('ls-tree', '-r', '-z', sha, '--', *paths)
              records = {}
              for entry in entries.split(b'\0'):
                  if not entry:
                      continue
                  metadata, name = entry.decode().split('\t', 1)
                  mode, kind, oid = metadata.split()
                  assert kind == 'blob' and mode in ('100644', '100755') and '..' not in Path(name).parts
                  assert name == TEST or name.startswith(f'{CORPUS}/fixtures/') or name.startswith(f'{CORPUS}/schema-twins/')
                  data = git('cat-file', 'blob', oid)
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == oid
                  target = harness / name.removeprefix('packages/core-internal/')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  records[name] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'git_blob': oid}
              assert records[TEST]['sha256'] == os.environ['EXPECTED_TEST_SHA256'], records[TEST]
              lock = git('show', f'{sha}:pnpm-lock.yaml').decode()
              package = {'name': 'schema-twin-windows-check', 'private': True, 'type': 'module',
                         'packageManager': 'pnpm@10.26.1', 'devDependencies': VERSIONS}
              (harness / 'package.json').write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
              (harness / 'pnpm-lock.yaml').write_text(isolated_lock(lock), encoding='utf-8', newline='\n')
              proof = {'result': 'PENDING', 'source_commit': sha, 'test': records[TEST],
                       'source_lock_sha256': hashlib.sha256(lock.encode()).hexdigest(), 'dependencies': VERSIONS,
                       'files': records, 'scope': 'Complete unchanged schemaTwinConformance.test.ts and exact corpus in an isolated harness; not the SDK suite or its workspace configuration.'}
              (evidence / 'full-test-source.json').write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
              for name in ['package.json', 'pnpm-lock.yaml']:
                  (evidence / name).write_bytes((harness / name).read_bytes())
              print(json.dumps({key: value for key, value in proof.items() if key != 'files'}, indent=2))
              print(f'Materialized {len(records)} exact Git blobs; no test or fixture rewriting.')
          
          
          if __name__ == '__main__':
              main()
      - name: Run complete schema-twin file on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $harness = Join-Path $env:RUNNER_TEMP 'schema-twin-full-test'
          $evidence = Join-Path $env:RUNNER_TEMP 'schema-twin-evidence'
          @("Node=$(node --version)", "pnpm=$(pnpm --version)") | Tee-Object -FilePath (Join-Path $evidence 'test-environment.log')
          pnpm --dir $harness install --frozen-lockfile --ignore-scripts --store-dir (Join-Path $env:RUNNER_TEMP 'schema-twin-pnpm-store') 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'test-install.log')
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          pnpm --dir $harness exec vitest run test/wire/schemaTwinConformance.test.ts --maxWorkers=1 --fileParallelism=false --reporter=default --reporter=json "--outputFile.json=$(Join-Path $evidence 'vitest-results.json')" 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'vitest.log')
          if ($LASTEXITCODE -ne 0) { throw 'Full schema-twin test file failed' }
      - name: Verify complete-file report
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          assert os.name == 'nt', 'Native Windows is required'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'schema-twin-evidence'
          report = json.loads((evidence / 'vitest-results.json').read_text(encoding='utf-8'))
          assert report['success'] is True and report['numTotalTests'] == 180
          assert report['numPassedTests'] == 180 and report['numFailedTests'] == 0 and report['numPendingTests'] == 0
          assert len(report['testResults']) == 1 and len(report['testResults'][0]['assertionResults']) == 180
          proof = json.loads((evidence / 'full-test-source.json').read_text(encoding='utf-8'))
          proof.update(result='PASS', native_windows=True, tests_passed=180, tests_failed=0)
          (evidence / 'full-test-source.json').write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(f"\nComplete unchanged schemaTwinConformance.test.ts: 180/180 passed on native Windows. Source: `{proof['source_commit']}`. Test SHA256: `{proof['test']['sha256']}`. Isolated fixture harness with source-locked dependencies, not the full SDK suite.\n")
          print('PASS: complete unchanged schemaTwinConformance.test.ts, 180/180 tests on native Windows')
      - name: Upload real verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-twin-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema-twin-evidence/
          if-no-files-found: error
          retention-days: 7
